name: Validate build kit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build-guide.py
      - run: python scripts/validate.py
      - run: node --test tests/guide.test.cjs
      - name: Verify generated guide is committed
        run: git diff --exit-code
